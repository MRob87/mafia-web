# Dockerfile needs the monorepo root as build context (to reach packages/shared),
# so deploy from the repo root with:
#   fly deploy --config apps/server/fly.toml --dockerfile apps/server/Dockerfile .
app = "mafia-web-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
